[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-worker"
version = "0.1.0"
description = "AgentFlow multilingual external node Worker SDK"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["AgentFlowWorker*"]
